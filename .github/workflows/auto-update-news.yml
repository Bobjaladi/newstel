name: Auto Update News

on:
  # Schedule: 5 times a day (IST = UTC + 5:30)
  schedule:
    - cron: '30 23 * * *'  # 05:00 IST (23:30 UTC previous day)
    - cron: '30 3 * * *'   # 09:00 IST (03:30 UTC)
    - cron: '30 7 * * *'   # 13:00 IST (07:30 UTC)
    - cron: '30 11 * * *'  # 17:00 IST (11:30 UTC)
    - cron: '30 15 * * *'  # 21:00 IST (15:30 UTC)

  # Allow manual trigger
  workflow_dispatch:

# Prevent concurrent runs
concurrency:
  group: news-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Step 1 - Fetch news (Telugu, English, Hindi)
        id: fetch
        run: |
          echo "📰 Running native RSS fetcher (no translation)..."
          python fetch_news_native.py

      - name: Step 2 - Validate output files
        id: validate
        run: |
          for file in newstelugu.json english.json hindi.json; do
            if [ ! -f "$file" ]; then
              echo "❌ Error: $file was not created"
              exit 1
            fi

            # Must be valid JSON and a non-empty list
            python -c "
          import json, sys
          data = json.load(open('$file', encoding='utf-8'))
          if not isinstance(data, list) or len(data) == 0:
              sys.exit('$file is empty or not a list')
          print('$file: ' + str(len(data)) + ' articles')
          " || {
              echo "❌ Error: $file is invalid or empty"
              exit 1
            }

            echo "✅ $file validated"
          done

      - name: Step 3 - Commit and push changes
        id: commit
        run: |
          CURRENT_TIME=$(TZ="Asia/Kolkata" date +"%Y-%m-%d %H:%M IST")

          git add newstelugu.json english.json hindi.json

          if git diff --staged --quiet; then
            echo "No news changes detected. Nothing to commit."
            echo "changes_made=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto update news - $CURRENT_TIME"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "✅ Changes committed and pushed"
            echo "changes_made=true" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "📊 Workflow Execution Summary"
          echo "=========================================="
          echo "Time: $(TZ="Asia/Kolkata" date +"%Y-%m-%d %H:%M:%S IST")"
          echo "Fetch Status: ${{ steps.fetch.outcome }}"
          echo "Validation Status: ${{ steps.validate.outcome }}"
          echo "Changes Made: ${{ steps.commit.outputs.changes_made }}"
          echo "=========================================="
